name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python checks (macOS ARM64)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Test MLX on CPU
        run: uv run --locked pytest

      - name: Build distributions
        run: uv build

      - name: Verify built wheel
        run: >-
          uv run --isolated --no-project --python 3.12
          --with ./dist/*.whl
          python -c "import weftlm; from importlib.metadata import version;
          assert 'site-packages' in weftlm.__file__;
          print(version('weftlm')); print(weftlm.__file__)"
