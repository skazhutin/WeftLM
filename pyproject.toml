[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "weftlm"
version = "0.1.0"
description = "Experimental context-parallel attention on Apple Silicon with MLX."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["mlx==0.32.3"]

[project.urls]
Repository = "https://github.com/skazhutin/WeftLM"
Issues = "https://github.com/skazhutin/WeftLM/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/weftlm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
